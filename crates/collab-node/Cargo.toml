[package]
name = "figcraft-collab-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The live-editing shim and the assistant's command surface compiled for node (wasm-bindgen), so OneOS can test two windows converging through its real CRDT engine, and drive a design through the design.* tools"

# No workspace lints: the wasm-bindgen macros expand to code the workspace's `unsafe_code = "forbid"` refuses.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
figcraft-engine = { workspace = true }
figcraft-host-collab = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
wasm-bindgen = "0.2"
